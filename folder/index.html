<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hyderabad House Price MLOps Lab</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; line-height: 1.5; }
      input, button { padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; }
      pre { background: #f5f5f5; padding: 16px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Hyderabad House Price MLOps Lab</h1>
    <p>Paste the API Gateway URL, then send a house sample to the Lambda inference API.</p>

    <label>API URL</label>
    <input id="apiUrl" value="https://zxbyhhvixj.execute-api.ap-south-1.amazonaws.com" />

    <label>Features: square_feet, bedrooms, bathrooms, property_age, distance_to_hitech_city_km</label>
    <input id="features" value="1200,3,2,5,8" />

    <button onclick="predict()">Predict</button>
    <pre id="output">Waiting for prediction...</pre>

    <script>
      async function predict() {
        const output = document.getElementById("output");
        const apiUrl = document.getElementById("apiUrl").value.trim().replace(/\/$/, "");
        const features = document.getElementById("features").value.split(",").map(Number);

        if (!apiUrl.startsWith("https://")) {
          output.textContent = "Paste the HTTPS API Gateway invoke URL first.";
          return;
        }

        try {
          output.textContent = "Calling API...";
          const response = await fetch(`${apiUrl}/predict`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ features })
          });
          const payload = await response.json();
          output.textContent = JSON.stringify(payload, null, 2);
        } catch (error) {
          output.textContent = [
            "Failed to call API Gateway.",
            "Check that API Gateway exists, CORS is enabled, route is POST /predict, and Lambda is deployed.",
            `Browser error: ${error.message}`
          ].join("\n");
        }
      }
    </script>
  </body>
</html>

name: SageMaker MLOps Lab

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      start_pipeline:
        description: Start SageMaker pipeline
        required: false
        default: "true"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  PIPELINE_NAME: sagemaker-mlops-lab

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate lab
        run: make validate

      - name: Run smoke tests
        run: make test

  run-pipeline:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export variables
        run: |
          echo "SAGEMAKER_ROLE_ARN=${{ vars.SAGEMAKER_ROLE_ARN || secrets.SAGEMAKER_ROLE_ARN }}" >> $GITHUB_ENV
          echo "MODEL_BUCKET=${{ vars.MODEL_BUCKET || secrets.MODEL_BUCKET }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_URI=${{ vars.MLFLOW_TRACKING_URI || secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV

      # 🚀 ALWAYS UPSERT PIPELINE
      - name: Upsert SageMaker pipeline
        run: |
          python scripts/run_pipeline.py \
            --region "$AWS_REGION" \
            --pipeline-name "$PIPELINE_NAME"

      # 🚀 ALWAYS START PIPELINE (FIXED)
      - name: Start SageMaker pipeline
        run: |
          echo "Starting pipeline..."
          python scripts/run_pipeline.py \
            --region "$AWS_REGION" \
            --pipeline-name "$PIPELINE_NAME" \
            --start